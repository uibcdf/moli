name: Sabueso Recorda hand-off example

on:
  pull_request:
    paths:
      - "examples/sabueso_recorda/**"
      - ".github/workflows/sabueso-recorda-handoff.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receiving:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the exact public scientific producer
        uses: actions/checkout@v4
        with:
          repository: uibcdf/sabueso
          ref: 792bd0da45245ad0fca08e4b431e5e49e4d76ae8
          path: _sabueso
          fetch-depth: 0
      - uses: mamba-org/setup-micromamba@v3.2.1
        with:
          environment-file: _sabueso/devtools/conda-envs/test_env.yaml
          environment-name: receiving
          condarc: |
            channels:
              - uibcdf
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=3.14
            uibcdf::ackredit=0.9.0=py_0
            uibcdf::recorda=0.3.0=py_0
            pytest-xdist
      - name: Install the source-development producer
        shell: bash -l {0}
        run: python -m pip install --no-deps --no-build-isolation --editable _sabueso
      - name: Verify provider and scientific import ownership
        shell: bash -l {0}
        run: |
          cd "$RUNNER_TEMP"
          python -c "import ackredit,recorda,sabueso; assert 'site-packages' in ackredit.__file__; assert 'site-packages' in recorda.__file__; assert '/_sabueso/' in sabueso.__file__"
      - name: Test public artifact consumption and failure states
        shell: bash -l {0}
        env:
          SABUESO_CHECKOUT: ${{ github.workspace }}/_sabueso
        run: |
          python -m pytest -n 12 --receptor=ci \
            -W 'error:unclosed database:ResourceWarning' \
            -W error::pytest.PytestUnraisableExceptionWarning \
            examples/sabueso_recorda/tests
