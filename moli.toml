schema_version = "0.3"

[platform]
name = "MOLI"
repository = "uibcdf/moli"
architecture = "architecture_1.0"
governance_model = "component-governance-with-internal-delegation"

[governance]
repository = "uibcdf/moli"
guide = "MOLI_GUIDE.md"
infrastructure_census = "devguide/INFRASTRUCTURE_CENSUS.md"
reporting_protocol = "devguide/governance/reporting_protocol.md"
policy_inheritance = "transitive-by-capability"
policy_inheritance_contract = "devguide/governance/policy_inheritance.md"

[policies.reporting_lifecycle]
status = "accepted"
applies_to = ["direct-component"]
normative = "devguide/governance/reporting_protocol.md"
open_statuses = ["open", "active", "blocked", "partial"]
closed_statuses = ["resolved", "withdrawn", "superseded"]
issue_identity = true
archive_mode = "repository-local"

[policies.issue_feedback]
status = "accepted"
applies_to = ["repository", "support-infrastructure"]
normative = "devguide/governance/reporting_protocol.md"
issue = "uibcdf/moli#9"

[policies.support_infrastructure]
status = "accepted"
applies_to = ["repository"]
normative = "devguide/governance/support_infrastructure.md"
issue = "uibcdf/moli#10"

[policies.cross_component_feedback]
status = "accepted"
applies_to = ["direct-component"]
normative = "devguide/governance/cross_component_feedback.md"
provider_report_required = true
consumer_cross_link_required = true

[policies.python]
status = "accepted"
applies_to = ["capability:python-package"]
requires_python = ">=3.11,<3.14"
development_version = "3.13"
ci_versions = ["3.11", "3.12", "3.13"]
normative = "devguide/policies/python_policy.md"

[policies.python.transition]
status = "active"
target_requires_python = ">=3.11,<3.15"
target_ci_versions = ["3.11", "3.12", "3.13", "3.14"]

[[policies.python.transition.components]]
name = "sabueso"
issue = "uibcdf/sabueso#3"
state = "admitted"
note = "Python 3.14 support predates MOLI engineering-governance adoption and is continuously tested."

[policies.python_ci]
status = "accepted"
applies_to = ["capability:python-package"]
routine_python = "3.13"
routine_events = ["push", "pull_request"]
routine_os = "linux"
full_matrix_frequency = "weekly"
full_matrix_os = ["linux"]
manual_dispatch = true
normative = "devguide/policies/python_ci_policy.md"

[policies.python_quality]
status = "accepted"
applies_to = ["capability:python-package"]
formatter = "ruff"
linter = "ruff"
test_runner = "pytest"
ruff_version = "0.16.5"
target_version = "py311"
required_lint_rules = ["E4", "E7", "E9", "F", "I"]
normative = "devguide/policies/python_tooling_policy.md"

[policies.python_support_libraries]
status = "accepted"
applies_to = ["capability:python-package"]
libraries = ["argdigest", "depdigest", "smonitor", "pyunitwizard"]
review_field = "python_ecosystem_review"
normative = "devguide/policies/python_support_libraries_policy.md"

[policies.python_developer_tools]
status = "accepted"
applies_to = ["capability:python-package"]
tools = ["pytest-receptor", "gh-run-receptor"]
review_field = "python_ecosystem_review"
normative = "devguide/policies/python_developer_tools_policy.md"

[policies.python_distribution]
status = "accepted"
applies_to = ["capability:python-package"]
primary_public_channel = "uibcdf"
third_party_channel = "conda-forge"
pypi_route = "optional-verified"
review_field = "python_distribution_review"
normative = "devguide/policies/python_distribution_policy.md"

[policies.release_version]
status = "accepted"
applies_to = ["repository"]
format = "X.Y.Z"
pattern = '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
public_prereleases = false
normative = "devguide/policies/release_version_policy.md"

[policies.repository_badges]
status = "accepted"
applies_to = ["repository"]
normative = "devguide/policies/repository_badges.md"

[policies.zenodo_archival]
status = "accepted"
applies_to = ["repository"]
normative = "devguide/policies/zenodo_policy.md"

[policies.component_guide]
status = "accepted"
applies_to = ["guide-delivery:vendored"]
filename = "MOLI_GUIDE.md"
copy_mode = "byte-identical"
agents_reference_required = true
validator = "devtools/scripts/check_component_guides.py"

[components.sabueso]
repository = "uibcdf/sabueso"
domain = "scientific-context"
role = "knowledge"
governance = "direct"
guide_delivery = "vendored"
capabilities = ["python-package"]
python_ecosystem_review = { issue = "uibcdf/sabueso#31", state = "pending" }
python_distribution_review = { issue = "uibcdf/sabueso#34", state = "pending" }

[components.praxis]
repository = "uibcdf/praxis"
domain = "scientific-context"
role = "methodology"
governance = "direct"
guide_delivery = "vendored"
capabilities = []

[components.nextia]
repository = "uibcdf/nextia"
domain = "scientific-context"
role = "discovery"
governance = "direct"
guide_delivery = "vendored"
capabilities = []

[components.molsyssuite]
repository = "uibcdf/molsyssuite"
domain = "molecular-modeling"
role = "modeling-ecosystem"
governance = "direct"
guide_delivery = "reference"
capabilities = ["governed-ecosystem"]
internal_governance = "delegated"
internal_governance_repository = "uibcdf/molsyssuite"

[components.moli-agent]
repository = "uibcdf/moli-agent"
domain = "reasoning"
role = "scientific-agent"
governance = "direct"
guide_delivery = "vendored"
capabilities = []

[support_infrastructure]
scope = "uibcdf-shared-development"
normative = "devguide/governance/support_infrastructure.md"

[[support_infrastructure.resources]]
name = "pytest-receptor"
repository = "uibcdf/pytest-receptor"
kind = "developer-receptor"
guidance = "devguide/policies/python_developer_tools_policy.md"
delegated_member_of = "uibcdf/molsyssuite"

[[support_infrastructure.resources]]
name = "gh-run-receptor"
repository = "uibcdf/gh-run-receptor"
kind = "developer-receptor"
guidance = "devguide/policies/python_developer_tools_policy.md"
delegated_member_of = "uibcdf/molsyssuite"

[[support_infrastructure.resources]]
name = "action-build-and-upload-conda-packages"
repository = "uibcdf/action-build-and-upload-conda-packages"
kind = "github-action"
guidance = "devguide/policies/python_distribution_policy.md"

[[support_infrastructure.resources]]
name = "action-sphinx-docs-to-gh-pages"
repository = "uibcdf/action-sphinx-docs-to-gh-pages"
kind = "github-action"
guidance = "devguide/governance/support_infrastructure.md"
